name: Validar projeto
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          CI: true
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - run: docker compose -p odontoagenda-ci -f compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - if: always()
        run: docker compose -p odontoagenda-ci -f compose.test.yml down --volumes
